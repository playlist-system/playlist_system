<!doctype html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* หน้ามือถือคนถ่ายรูป (5.5.88) — แบบ B: แถบหัวน้ำเงินเข้ม (สีหลักใบเช็ค) รหัสจอพื้นฟ้า (สีแถบรหัสจอในใบเช็ค)
     ตามหลัก Arc UI: ตัวอักษร 400 / 500 • ขนาด 12 13 15 17 22 28 34 • มุมโค้ง 14 / 20 / 24 • สีใช้เฉพาะที่มีความหมาย
     โหมดกลางแดด (ปุ่มรูปพระอาทิตย์): พื้นขาวล้วน ตัวดำ เส้นเข้ม ตัวใหญ่ขึ้น — จำไว้ในเครื่อง */
  :root {
    --navy: #0B2766; --navy2: #13348A; --cyan: #82ECFE; --on-navy: #FFFFFF; --on-navy2: #C9D4EE;
    --bg: #EEF1F6; --sf: #FFFFFF; --fg: #0E1726; --tx2: #46506A; --mu: #6A7388; --ln: #DFE4EC; --muted: #E6EAF1;
    --ok: #14804A; --oks: #E3F4EA; --red: #C62828; --reds: #FDECEC; --warn: #9A5B00; --warns: #FFF3DC;
    --fs: 15px; --bw: 1px;
    --font: "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-sun]) { --bg: #0C111C; --sf: #161D2B; --fg: #EEF2F8; --tx2: #C2CADB; --mu: #93A0B8; --ln: #263045; --muted: #222B3D;
      --ok: #6FD39C; --oks: #15301F; --red: #FF8A80; --reds: #3A1F22; --warn: #F0B35B; --warns: #3A2C14; --navy: #0A1F52; }
  }
  :root[data-sun] { --navy: #00174D; --navy2: #00174D; --cyan: #7FE9FF; --on-navy2: #FFFFFF;
    --bg: #FFFFFF; --sf: #FFFFFF; --fg: #000000; --tx2: #111111; --mu: #2B2B2B; --ln: #1A1A1A; --muted: #D5D9E0;
    --ok: #0B5E33; --oks: #D7F0E1; --red: #A50F0F; --reds: #FFE1E1; --warn: #6B3F00; --warns: #FFE9C2; --fs: 17px; --bw: 1.5px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--fg); font: 400 var(--fs)/1.45 var(--font); -webkit-text-size-adjust: 100%; }
  button, input, select { font: inherit; color: inherit; }
  button { background: none; border: 0; text-align: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--navy2); outline-offset: 2px; border-radius: 10px; }
  .num { font-variant-numeric: tabular-nums; }
  .page { max-width: 560px; margin: 0 auto; padding: 0 0 40px; display: flex; flex-direction: column; gap: 18px; }

  .hero { background: var(--navy); color: var(--on-navy); padding: 18px 20px 18px; border-radius: 0 0 24px 24px; }
  .bar1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 36px; }
  .sun { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 99px; font-size: 13px; color: var(--on-navy); box-shadow: inset 0 0 0 1px rgba(255,255,255,.45); }
  .sun svg { width: 18px; height: 18px; }
  :root[data-sun] .sun { background: var(--cyan); color: var(--navy); box-shadow: none; font-weight: 500; }
  .pick { display: flex; align-items: center; gap: 8px; margin: 6px 0 4px; font-size: 13px; color: var(--on-navy2); }
  .pick select { flex: 1; min-width: 0; height: 40px; padding: 0 10px; border: 0; border-radius: 12px; background: rgba(255,255,255,.12); color: var(--on-navy); font-size: 16px; }
  .pick option { color: #000; }
  .head h1 { font-size: 28px; font-weight: 500; line-height: 1.2; overflow-wrap: anywhere; }
  .head p { font-size: 13px; color: var(--on-navy2); margin-top: 2px; }
  .sum { display: flex; align-items: center; gap: 20px; margin-top: 14px; }
  .ring { width: 128px; height: 128px; position: relative; flex: none; }
  .ring svg { width: 100%; height: 100%; display: block; }
  .track { stroke: rgba(255,255,255,.16); } .fillc { stroke: var(--cyan); }
  .ring .v { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 6px; }
  .ring .v b { font-size: 34px; font-weight: 500; line-height: 1; }
  .ring .v span { font-size: 12px; color: var(--on-navy2); margin-top: 4px; }
  .stats { display: grid; gap: 10px; }
  .stat b { display: block; font-size: 22px; font-weight: 500; line-height: 1.1; }
  .stat span { font-size: 13px; color: var(--on-navy2); }
  .foot { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.16); font-size: 13px; color: var(--on-navy2); }

  .grp { padding: 0 16px; }
  .sec { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .sec h2 { font-size: 17px; font-weight: 500; }
  .sec span { font-size: 13px; color: var(--mu); }
  .list { display: grid; gap: 10px; }
  .row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 10px 12px 12px; background: var(--sf); border: var(--bw) solid var(--ln); border-radius: 20px; }
  .row:active { background: var(--muted); }
  .row .m { flex: 1; min-width: 0; }
  .id { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .code { font-size: 15px; font-weight: 500; color: #0B2766; background: var(--cyan); border-radius: 7px; padding: 1px 9px; }
  .type { display: inline-flex; align-items: center; height: 24px; font-size: 12px; font-weight: 500; color: var(--fg); box-shadow: inset 0 0 0 var(--bw) var(--fg); border-radius: 6px; padding: 0 8px; }
  .nm { display: block; font-size: var(--fs); font-weight: 500; margin-top: 6px; overflow-wrap: anywhere; }
  .pk { display: block; font-size: 12px; color: var(--mu); }
  .row .r { width: 84px; flex: none; text-align: right; }
  .row .r b { display: block; font-size: var(--fs); font-weight: 500; }
  .row .r b.ok { color: var(--ok); }
  .row .r small { display: block; font-size: 12px; color: var(--mu); margin-top: 2px; }
  .bar { height: 6px; border-radius: 9px; background: var(--muted); overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; background: var(--navy2); border-radius: 9px; }
  @media (prefers-color-scheme: dark) { :root:not([data-sun]) .bar i { background: var(--cyan); } }
  .row.done .bar i { background: var(--ok); }
  .chev { width: 16px; height: 16px; color: var(--mu); flex: none; }

  .scr .back { display: inline-flex; align-items: center; gap: 4px; color: var(--on-navy2); font-size: 15px; min-height: 36px; margin-left: -4px; }
  .scr .back svg { width: 18px; height: 18px; }
  .scr .id { margin-top: 6px; }
  .scr .code { font-size: 28px; border-radius: 10px; padding: 0 12px; line-height: 1.35; }
  .scr .type { height: 28px; font-size: 15px; color: var(--on-navy); box-shadow: inset 0 0 0 1px rgba(255,255,255,.7); padding: 0 10px; border-radius: 7px; }
  .scr .nm { font-size: 17px; margin-top: 10px; color: var(--on-navy); }
  .scr .pk { font-size: 13px; color: var(--on-navy2); }
  .prog { margin-top: 14px; }
  .prog .t { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; margin-bottom: 8px; }
  .prog .t b { font-weight: 500; }
  .prog .bar { height: 8px; background: rgba(255,255,255,.16); margin: 0; }
  .prog .bar i { background: var(--cyan); }

  .ctl { display: grid; gap: 10px; padding: 0 16px; }
  .seg { display: flex; background: var(--muted); border-radius: 14px; padding: 4px; min-height: 48px; }
  .seg button { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 10px; color: var(--tx2); font-size: 15px; line-height: 1.25; padding: 4px 2px; }
  .seg button[aria-pressed="true"] { background: var(--navy); color: #fff; font-weight: 500; }
  .seg em { font-style: normal; font-size: 12px; color: var(--mu); }
  .seg button[aria-pressed="true"] em { color: var(--cyan); }
  .search { height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 4px 0 14px; background: var(--sf); border: var(--bw) solid var(--ln); border-radius: 14px; color: var(--mu); }
  .search svg { width: 18px; height: 18px; flex: none; }
  .search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; font-size: 16px; color: var(--fg); }
  .search input::placeholder { color: var(--mu); }
  .search input::-webkit-search-cancel-button { display: none; }
  .clr { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--mu); flex: none; }
  .clr[hidden] { display: none; }
  #films { margin: 0 16px; background: var(--sf); border: var(--bw) solid var(--ln); border-radius: 20px; overflow: hidden; }
  .film { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-top: var(--bw) solid var(--ln); }
  .film:first-child { border-top: 0; }
  .fn { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .tag { flex: none; display: inline-flex; align-items: center; gap: 5px; height: 24px; font-style: normal; font-size: 12px; font-weight: 500; border-radius: 6px; padding: 0 8px; white-space: nowrap; color: var(--red); background: var(--reds); }
  .tag.soon { box-shadow: inset 0 0 0 1px var(--red); }
  .tag.soon::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--red); }
  .tag.ok { color: var(--ok); background: var(--oks); }
  .tag.miss { color: var(--warn); background: var(--warns); }
  .tag.mu { color: var(--tx2); background: var(--muted); }
  .r2 { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .day { flex: none; font-size: 13px; color: var(--mu); white-space: nowrap; }
  .empty { padding: 20px 16px; text-align: center; color: var(--tx2); }
  .foot2 { font-size: 13px; color: var(--mu); text-align: center; margin-top: -8px; padding: 0 16px; }
  .note { margin: 16px; padding: 20px; background: var(--sf); border: var(--bw) solid var(--ln); border-radius: 24px; color: var(--tx2); }
  .note b { display: block; font-size: 17px; font-weight: 500; color: var(--fg); margin-bottom: 4px; }
  .busy { opacity: .5; pointer-events: none; }
</style>
</head>
<body>
<main id="app" class="page" aria-live="polite"></main>
<script>
var B = <?!= boot ?>;
var TH_MON = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
var ST = { view: 'home', si: 0, tab: 'todo', q: '', scr: [], loading: false, err: '' };
var app = document.getElementById('app');
var H = (window.google && google.script && google.script.history) || null, pushed = 0;
var LS = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ไม่จำก็ได้ */ } } };
if (LS.get('ph-sun') === '1') document.documentElement.setAttribute('data-sun', '');

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function fmt(n) { return Number(n || 0).toLocaleString('en-US'); }
function pct(a, n) { return n ? Math.round(100 * a / n) : 100; }
function bkk(ms) { return new Date(ms + 7 * 3600e3); }   // วันเวลาไทย (อ่านด้วย getUTC…)
function today0() { var d = bkk(Date.now()); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); }
function dayMon(ms) { var d = new Date(ms); return d.getUTCDate() + ' ' + TH_MON[d.getUTCMonth()]; }
function stamp(ms) {
  if (!ms) return '';
  var d = bkk(ms);
  return 'ข้อมูลวันที่ ' + d.getUTCDate() + ' ' + TH_MON[d.getUTCMonth()] + ' ' + (d.getUTCFullYear() + 543) + ' เวลา ' + ('0' + d.getUTCHours()).slice(-2) + ':' + ('0' + d.getUTCMinutes()).slice(-2);
}
var ICON = {
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  x: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
};

// แยกหนังของแต่ละจอ: ยังไม่ถ่าย / ถ่ายแล้ว (ยังฉายอยู่ทั้งคู่) และออกแล้ว (วันที่ออกผ่านไปแล้ว — ไม่นับใน % และจำนวนค้าง)
// ข้อมูลจาก PHOTO CHECK STUDIO: t = [ชื่อ, วันที่ออก] ยังไม่ถ่าย • d = [ชื่อ, วันที่ถ่าย, วันที่ออก] ถ่ายแล้ว
function prep(c) {
  var t0 = today0(), on = function (ed) { return !ed || ed >= t0; };
  var t = c.t.filter(function (r) { return on(r[1]); }), d = c.d.filter(function (r) { return on(r[2]); });
  var gone = c.t.filter(function (r) { return !on(r[1]); }).map(function (r) { return [r[0], 0, r[1]]; })
    .concat(c.d.filter(function (r) { return !on(r[2]); }).map(function (r) { return [r[0], r[1] || -1, r[2]]; }))
    .sort(function (a, b) { return b[2] - a[2]; });                         // ออกล่าสุดอยู่บน
  return { c: c, t: t, d: d, g: gone, n: t.length + d.length, s: d.length };
}
function setData(d) {
  B.data = d;
  ST.scr = (d && d.screens || []).map(prep).map(function (x, i) { x.i = i; x.p = x.n ? x.s / x.n : 1; return x; })
    .sort(function (a, b) { return a.p - b.p || (b.n - b.s) - (a.n - a.s) || a.i - b.i; });
}
function ring(p) {
  var r = 52, C = 2 * Math.PI * r, arc = C * 0.75, v = Math.max(0, Math.min(1, p)) * arc;
  return '<svg viewBox="0 0 128 128" aria-hidden="true"><circle class="track" cx="64" cy="64" r="' + r + '" fill="none" stroke-width="11" stroke-linecap="round" stroke-dasharray="' + arc.toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(135 64 64)"/>' +
    (v > 0 ? '<circle class="fillc" cx="64" cy="64" r="' + r + '" fill="none" stroke-width="11" stroke-linecap="round" stroke-dasharray="' + v.toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(135 64 64)"/>' : '') + '</svg>';
}
function chip(y) { return y ? '<span class="type">' + esc(y) + '</span>' : ''; }
function mine() { return B.admin ? 'ทุกจอ' : 'จอของคุณ'; }
function sunBtn() { var on = document.documentElement.hasAttribute('data-sun'); return '<button class="sun" data-a="sun" aria-pressed="' + on + '">' + ICON.sun + (on ? 'โหมดกลางแดด: เปิด' : 'โหมดกลางแดด') + '</button>'; }
function picker() {
  if (!B.names || B.names.length < 2) return '';
  return '<label class="pick"><span>ใบเช็คของ</span><select id="pick" aria-label="เลือกใบเช็ค">' +
    B.names.map(function (n) { return '<option' + (n === B.cur ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('') + '</select></label>';
}
function vNote(t, sub) { return '<section class="note"><b>' + t + '</b>' + (sub || '') + '</section>'; }

function vHome() {
  var d = B.data, N = 0, S = 0, G = 0;
  ST.scr.forEach(function (x) { N += x.n; S += x.s; G += x.g.length; });
  var h = '<section class="hero"><div class="bar1"><span></span>' + sunBtn() + '</div>' + picker() + '<header class="head"><h1>' + esc(d.name || B.cur) + '</h1><p>' + esc(stamp(d.at)) + '</p></header>' +
    '<div class="sum"><div class="ring" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct(S, N) + '" aria-valuetext="ถ่ายแล้ว ' + pct(S, N) + '%">' + ring(N ? S / N : 1) +
    '<div class="v" aria-hidden="true"><b class="num">' + pct(S, N) + '%</b><span>ถ่ายแล้ว</span></div></div>' +
    '<div class="stats"><div class="stat"><b class="num">' + fmt(N - S) + '</b><span>ยังไม่ถ่าย</span></div><div class="stat"><b class="num">' + fmt(S) + '</b><span>ถ่ายแล้ว</span></div>' +
    '<div class="stat"><b class="num">' + fmt(ST.scr.length) + '</b><span>จอ</span></div></div></div>' +
    '<p class="foot">นับเฉพาะหนังที่ยังฉายอยู่' + (G ? ' • หนังที่ออกไปแล้ว ' + fmt(G) + ' เรื่อง ดูได้ในแถบ “ออกแล้ว” ของแต่ละจอ' : '') + '</p></section>';
  h += '<section class="grp"><div class="sec"><h2>' + mine() + '</h2><span>ถ่ายน้อยอยู่บน</span></div><div class="list">';
  ST.scr.forEach(function (x, k) {
    var c = x.c, left = x.n - x.s, pp = pct(x.s, x.n);
    h += '<button class="row' + (left ? '' : ' done') + '" data-s="' + k + '"><div class="m"><div class="id"><span class="code">' + esc(c.c) + '</span>' + chip(c.y) + '</div>' +
      '<span class="nm">' + esc(c.l || c.p) + '</span><span class="pk">' + esc(c.p) + '</span></div>' +
      '<div class="r">' + (left ? '<b class="num">ค้าง ' + fmt(left) + '</b>' : '<b class="ok">ครบ</b>') + '<div class="bar"><i style="width:' + pp + '%"></i></div><small class="num">' + pp + '%</small></div>' + ICON.chev + '</button>';
  });
  if (!ST.scr.length) h += '<p class="empty">ใบเช็คนี้ยังไม่มีจอ</p>';
  return h + '</div></section>';
}

function leave(ed, t0) { var dd = Math.round((ed - t0) / 864e5); return dd <= 0 ? 'ออกวันนี้' : dd === 1 ? 'ออกพรุ่งนี้' : 'ออก ' + dayMon(ed); }
function filmRows() {
  var x = ST.scr[ST.si], q = ST.q.trim().toLowerCase(), t0 = today0(), out = [];
  var src = ST.tab === 'todo' ? x.t : ST.tab === 'done' ? x.d : x.g;
  var rows = src.filter(function (r) { return !q || String(r[0]).toLowerCase().indexOf(q) >= 0; });
  if (ST.tab === 'todo') rows = rows.map(function (r, i) { return [r, i]; })                                     // ใกล้ออกอยู่บน
    .sort(function (a, b) { return (a[0][1] || 9e15) - (b[0][1] || 9e15) || a[1] - b[1]; }).map(function (z) { return z[0]; });
  rows.forEach(function (r) {
    var right;
    if (ST.tab === 'todo') right = r[1] ? '<em class="tag' + (r[1] - t0 <= 864e5 ? ' soon' : '') + '">' + leave(r[1], t0) + '</em>' : '';
    else if (ST.tab === 'done') right = '<span class="day">' + (r[1] ? 'ถ่ายวันที่ ' + r[1] : 'ถ่ายแล้ว') + '</span>';
    else right = '<span class="r2"><em class="tag ' + (r[1] ? 'ok">ถ่ายทัน' + (r[1] > 0 ? ' • วันที่ ' + r[1] : '') : 'miss">ไม่ได้ถ่าย') + '</em><span class="day">ออก ' + dayMon(r[2]) + '</span></span>';
    out.push('<div class="film"><span class="fn">' + esc(r[0]) + '</span>' + right + '</div>');
  });
  if (!rows.length) out.push('<p class="empty">' + (q ? 'ไม่พบหนังที่ชื่อมีคำว่า “' + esc(ST.q.trim()) + '”' : ST.tab === 'todo' ? 'ถ่ายครบทุกเรื่องแล้ว' : ST.tab === 'done' ? 'ยังไม่มีเรื่องที่ถ่ายแล้ว' : 'ยังไม่มีหนังที่ออกไปแล้ว') + '</p>');
  return out.join('');
}
function vScreen() {
  var x = ST.scr[ST.si], c = x.c, pp = pct(x.s, x.n);
  var h = '<section class="hero scr"><div class="bar1"><button class="back" data-a="home">' + ICON.back + mine() + '</button>' + sunBtn() + '</div>' +
    '<div class="id"><span class="code">' + esc(c.c) + '</span>' + chip(c.y) + '</div><p class="nm">' + esc(c.l || '—') + '</p><p class="pk">' + esc(c.p) + '</p>' +
    '<div class="prog"><div class="t"><span>ถ่ายแล้ว <b class="num">' + fmt(x.s) + '</b> จาก <b class="num">' + fmt(x.n) + '</b></span><b class="num">' + pp + '%</b></div>' +
    '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pp + '" aria-label="ถ่ายแล้ว"><i style="width:' + pp + '%"></i></div></div></section>';
  h += '<div class="ctl"><div class="seg" role="group" aria-label="รายการหนัง">' +
    '<button data-t="todo" aria-pressed="' + (ST.tab === 'todo') + '">ยังไม่ถ่าย<em class="num">' + fmt(x.t.length) + '</em></button>' +
    '<button data-t="done" aria-pressed="' + (ST.tab === 'done') + '">ถ่ายแล้ว<em class="num">' + fmt(x.d.length) + '</em></button>' +
    '<button data-t="gone" aria-pressed="' + (ST.tab === 'gone') + '">ออกแล้ว<em class="num">' + fmt(x.g.length) + '</em></button></div>' +
    '<label class="search">' + ICON.search + '<input id="q" type="search" placeholder="ค้นหาชื่อหนัง" aria-label="ค้นหาชื่อหนัง" autocomplete="off" value="' + esc(ST.q) + '">' +
    '<button class="clr" data-a="clr" aria-label="ล้างคำค้น"' + (ST.q ? '' : ' hidden') + '>' + ICON.x + '</button></label></div>';
  h += '<div id="films">' + filmRows() + '</div>';
  var tip = { todo: 'ใกล้ออกอยู่บน', done: '', gone: 'หนังที่วันที่ออกผ่านไปแล้ว ไม่นับใน % • ออกล่าสุดอยู่บน' }[ST.tab];
  return h + (tip ? '<p class="foot2">' + tip + '</p>' : '');
}

function render() {
  var h;
  if (B.err) h = vNote('เปิดหน้ามือถือไม่ได้', '<p>' + esc(B.err) + '</p>');
  else if (!B.names || !B.names.length) h = vNote('ยังไม่มีใบเช็คที่เปิดดูได้', '<p>อีเมล ' + esc(B.me || '(ไม่ทราบ)') + ' ยังไม่มีชื่อในแท็บ “ผู้ใช้และสิทธิ์” — ให้ผู้ดูแลใส่อีเมลนี้ที่ใบเช็คของคุณ แล้วเปิดลิงก์นี้อีกครั้ง</p>');
  else if (!B.data) h = '<section class="hero"><div class="bar1"><span></span>' + sunBtn() + '</div>' + picker() + '<header class="head"><h1>' + esc(B.cur) + '</h1></header></section>' + vNote('ยังไม่มีข้อมูล', '<p>รอส่งข้อมูลจาก PHOTO CHECK STUDIO (หน้างานโฟลเดอร์และรูป → ขั้นที่ 4 ส่งเข้าหน้ามือถือ)</p>');
  else h = ST.view === 'scr' && ST.scr[ST.si] ? vScreen() : vHome();
  if (ST.err) h = vNote('โหลดไม่สำเร็จ', '<p>' + esc(ST.err) + '</p>') + h;
  app.innerHTML = h;
  app.classList.toggle('busy', ST.loading);
}

function openScreen(k) {
  ST.view = 'scr'; ST.si = k; ST.tab = 'todo'; ST.q = '';
  render(); window.scrollTo(0, 0);
  if (H) { try { H.push({ s: String(k) }, {}); pushed++; } catch (e) { /* ไม่มีประวัติก็กดปุ่มกลับได้ */ } }
}
function goHome(fromHistory) {
  if (!fromHistory && pushed && H) { pushed--; try { history.back(); } catch (e) { /* ใช้แบบด้านล่าง */ } setTimeout(function () { if (ST.view !== 'home') goHome(true); }, 350); return; }
  var k = ST.si; ST.view = 'home'; render();
  var b = app.querySelector('[data-s="' + k + '"]'); if (b) { b.scrollIntoView({ block: 'center' }); b.focus({ preventScroll: true }); }
}
if (H) { try { H.setChangeHandler(function (e) { var s = e && e.state && e.state.s; if (s == null || !ST.scr[+s]) { if (ST.view !== 'home') goHome(true); } else { ST.view = 'scr'; ST.si = +s; render(); } }); } catch (e) { H = null; } }

function loadPerson(name) {
  if (!name || name === B.cur || ST.loading) return;
  ST.loading = true; ST.err = ''; render();
  google.script.run.withFailureHandler(function (e) { ST.loading = false; ST.err = (e && e.message) || String(e); render(); })
    .withSuccessHandler(function (d) { ST.loading = false; B.cur = name; ST.view = 'home'; setData(d); LS.set('ph-cur', name); render(); })
    .getPerson(name);
}

app.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('[data-s],[data-a],[data-t]') : null;
  if (!t) return;
  if (t.hasAttribute('data-s')) return openScreen(+t.getAttribute('data-s'));
  if (t.hasAttribute('data-t')) { ST.tab = t.getAttribute('data-t'); render(); return; }
  var a = t.getAttribute('data-a');
  if (a === 'home') goHome(false);
  if (a === 'sun') { var el = document.documentElement, on = !el.hasAttribute('data-sun'); if (on) el.setAttribute('data-sun', ''); else el.removeAttribute('data-sun'); LS.set('ph-sun', on ? '1' : '0'); render(); }
  if (a === 'clr') { ST.q = ''; var q = document.getElementById('q'); q.value = ''; document.getElementById('films').innerHTML = filmRows(); t.hidden = true; q.focus(); }
});
app.addEventListener('input', function (e) {
  if (e.target.id !== 'q') return;
  ST.q = e.target.value;
  document.getElementById('films').innerHTML = filmRows();
  var c = app.querySelector('.clr'); if (c) c.hidden = !ST.q;
});
app.addEventListener('change', function (e) { if (e.target.id === 'pick') loadPerson(e.target.value); });

setData(B.data);
render();
// ผู้ดูแลที่เคยเลือกดูใบเช็คของคนอื่น เปิดครั้งหน้าเห็นคนเดิม
var lastCur = LS.get('ph-cur'); if (B.admin && lastCur && lastCur !== B.cur && B.names && B.names.indexOf(lastCur) >= 0) loadPerson(lastCur);
</script>
</body>
</html>
